<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Informativos & Dicas Tech - A TEC INFO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Script do Tema e CSS Base Global -->
    <script src="/thema.js"></script>    
    <link rel="stylesheet" href="cssBase.css">
</head>
<body class="bg-white dark:bg-studio-900 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-brand-600 selection:text-white overflow-x-hidden transition-colors duration-300">

    <!-- Menu Topo Reutilizável -->
    <div id="menuTopo"></div>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="pt-20 min-h-screen">
        
        <!-- ESTADO 1: LISTAGEM DE INFORMATIVOS (PADRÃO) -->
        <div id="viewListagem" class="hidden">
            
            <!-- Header Principal de Informativos (Tom Contrastante) -->
            <section class="pt-10 pb-12 bg-slate-100/70 dark:bg-studio-950/60 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 lg:px-8 transition-colors duration-200">
                <div class="max-w-7xl mx-auto">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div>
                            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 dark:bg-studio-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 text-xs font-semibold transition-colors duration-200">
                                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                                <i class="fa-solid fa-newspaper text-brand-600 dark:text-slate-200"></i> Blog & Notícias Tech
                            </div>
                            
                            <h1 class="font-display font-extrabold text-3xl sm:text-4xl lg:text-5xl text-slate-900 dark:text-white tracking-tight">
                                Informativos A TEC INFO
                            </h1>
                            <p class="text-slate-600 dark:text-slate-300 text-sm sm:text-base mt-2 max-w-2xl leading-relaxed">
                                Dicas práticas, orientações técnicas e cuidados para manter seus equipamentos e computadores sempre funcionando bem.
                            </p>
                        </div>

                        <!-- Campo de Busca -->
                        <div class="relative w-full md:w-80 shrink-0">
                            <input type="text" 
                                   id="inputBusca" 
                                   placeholder="Buscar por título ou tag..." 
                                   class="w-full pl-11 pr-4 py-3.5 bg-white dark:bg-studio-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-medium text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400 focus:bg-white dark:focus:bg-studio-800/90 shadow-sm transition-all">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-base"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Lista de Posts / Grid de Informativos (Tom Principal) -->
            <section class="py-12 bg-white dark:bg-studio-900 transition-colors duration-200">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    
                    <!-- Tags Populares / Filtros Rápidos -->
                    <div id="containerTags" class="flex flex-wrap items-center gap-2 mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                        <!-- Injetado dinamicamente pelo JS -->
                    </div>

                    <!-- Grid de Cards -->
                    <div id="gridPosts" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        <!-- Injetado dinamicamente pelo JS -->
                    </div>

                    <!-- Mensagem de NENHUM RESULTADO -->
                    <div id="noResults" class="hidden text-center py-16 bg-slate-50 dark:bg-studio-800 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="w-16 h-16 bg-slate-100 dark:bg-studio-700/50 text-slate-400 rounded-full flex items-center justify-center mx-auto text-2xl mb-4">
                            <i class="fa-solid fa-folder-open"></i>
                        </div>
                        <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">Nenhum informativo encontrado</h3>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Tente buscar por outros termos ou selecione outra tag.</p>
                    </div>

                </div>
            </section>
        </div>


        <!-- ESTADO 2: LEITURA DE UM INFORMATIVO ESPECÍFICO -->
        <article id="viewPost" class="hidden">
            <!-- Header Amplo do Artigo (Tom Contrastante) -->
            <section class="bg-slate-100/70 dark:bg-studio-950/60 border-b border-slate-200 dark:border-slate-800 pb-12 pt-8 px-4 sm:px-6 lg:px-8 transition-colors duration-200">
                <div class="max-w-7xl mx-auto">
                    
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                        <a href="/informativo" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-300 transition-colors">
                            <i class="fa-solid fa-arrow-left"></i> Voltar para os Informativos
                        </a>
                        
                        <div class="flex items-center gap-3">
                            <span id="postCategoria" class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/90 dark:bg-studio-800/90 backdrop-blur-md rounded-full text-[10px] font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700/80 shadow-sm transition-colors duration-200">
                                <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
                            </span>
                            <span id="postTempo" class="text-xs text-slate-500 dark:text-slate-400 font-medium"></span>
                        </div>
                    </div>

                    <h1 id="postTitulo" class="font-display font-extrabold text-3xl sm:text-4xl lg:text-5xl text-slate-900 dark:text-white leading-tight tracking-tight max-w-5xl"></h1>

                    <p id="postSubtitulo" class="mt-4 text-slate-600 dark:text-slate-300 text-base sm:text-lg max-w-3xl leading-relaxed"></p>

                    <!-- Banner de Capa -->
                    <div class="mt-8 relative w-full h-[300px] sm:h-[420px] rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-md">
                        <img id="postImagemCapa" src="" alt="" class="w-full h-full object-cover">
                    </div>

                </div>
            </section>

            <!-- Conteúdo HTML Injetado (Tom Principal) -->
            <section class="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto bg-white dark:bg-studio-900 transition-colors duration-200">
                <div class="bg-slate-50/50 dark:bg-studio-800/40 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 sm:p-12 lg:p-16 shadow-sm">
                    <div id="postConteudoHtml" class="max-w-4xl mx-auto space-y-8 text-slate-700 dark:text-slate-300 leading-relaxed">
                        <!-- O HTML do artigo vem do arquivo externo e é injetado aqui -->
                    </div>

                    
                </div>
            </section>
        </article>

    </main>

    <!-- Rodapé Reutilizável -->
    <div id="rodape"></div>

    <!-- Scripts do Sistema -->
    <script src="/load.js"></script> 
    <script src="scriptInformativo.js"></script>

</body>
</html>
